<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moovie Embed</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="/js/player-config.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

/* Status Overlay */
#status-overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0b0a08; padding: 1.5rem; text-align: center;
  transition: opacity 0.5s ease;
}
#status-overlay.hidden { opacity: 0; pointer-events: none; }
#status-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(255, 90, 31, 0.15); border-top-color: #ff5a1f;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 1.25rem;
}
#status-icon { font-size: 2.5rem; margin-bottom: 1rem; display: none; }
#status-title { font-size: 1.15rem; font-weight: 600; color: #f5efe4; margin-bottom: 0.4rem; }
#status-subtitle { font-size: 0.9rem; color: #9ca3af; max-width: 380px; line-height: 1.5; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Plyr overrides — floating control bar */
.plyr { width: 100% !important; height: 100% !important; background: #000 !important; }
.plyr__video-wrapper { height: 100% !important; width: 100% !important; display: flex; align-items: center; justify-content: center; }
.plyr video { width: 100% !important; height: 100% !important; object-fit: contain !important; }
.plyr__controls {
  background: rgba(11, 10, 8, 0.8) !important;
  backdrop-filter: blur(14px) saturate(1.2) !important;
  -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  border-radius: 10px !important;
  margin: 24px !important;
  padding: 10px 16px !important;
  position: absolute !important;
  bottom: 0 !important; left: 0 !important; right: 0 !important;
  z-index: 10 !important;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
}
.plyr__control { color: rgba(255, 90, 31, 0.8) !important; }
.plyr__control:hover { background: rgba(255, 90, 31, 0.1) !important; color: #ff723f !important; }
.plyr__progress input[type='range'] { color: #ff5a1f !important; }

/* Error */
#error-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #f85149; z-index: 25; font-size: 14px; background: rgba(0,0,0,0.85); padding: 20px 28px; border-radius: 10px; max-width: 80%; display: none; border: 1px solid rgba(248,81,73,0.2); }

/* Skip message */
#skipMsg { position: fixed; top: 20px; right: 20px; z-index: 15; color: #ff5a1f; font-size: 13px; background: rgba(11,10,8,0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; pointer-events: none; transition: opacity 0.3s; border: 1px solid rgba(255,90,31,0.15); display: none; }
#skipMsg.show { display: block; }

/* HLS menu */
.hls-menu { position: absolute; bottom: 110%; right: 0; background: rgba(11,10,8,0.95); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 4px 0; min-width: 130px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-height: 200px; overflow-y: auto; }
.hls-menu button { display: block; width: 100%; padding: 7px 16px; border: none; background: transparent; color: rgba(255,255,255,0.75); font-size: 12px; text-align: left; cursor: pointer; white-space: nowrap; }
.hls-menu button:hover { background: rgba(255,255,255,0.08); color: #fff; }
.hls-menu button.is-active { color: #ff5a1f; font-weight: 700; }
</style>
</head>
<body>

<div id="status-overlay">
  <div id="status-spinner"></div>
  <div id="status-icon">🚨</div>
  <h2 id="status-title">Finding streams...</h2>
  <p id="status-subtitle">Searching available sources for this title</p>
</div>

<div id="error-box"></div>
<div id="skipMsg"></div>
<div id="player-container"></div>

<script>
(function() {
  var cfg = window.PLAYER_CONFIG || { plyr: { controls: ['play-large','play','progress','current-time','duration','mute','volume','settings','fullscreen'], settings: ['quality','speed'], autoplay: true }, hls: { maxMaxBufferLength: 120, enableWorker: true } };

  var anSid = localStorage.getItem('an_sid');
  if (!anSid) { anSid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem('an_sid', anSid); }
  function anTrack(type, data) {
    try { var x = new XMLHttpRequest(); x.open('POST', '/api/analytics/event', true); x.setRequestHeader('Content-Type', 'application/json'); x.send(JSON.stringify({ type: type, sessionId: anSid, data: data || {} })); } catch(e) {}
  }
  var anHeartbeatTimer = null;
  function anStartHeartbeat(extra) { if (anHeartbeatTimer) clearInterval(anHeartbeatTimer); anHeartbeatTimer = setInterval(function() { anTrack('heartbeat', extra || {}); }, 30000); }
  function anStopHeartbeat() { if (anHeartbeatTimer) { clearInterval(anHeartbeatTimer); anHeartbeatTimer = null; } }

  var params = new URLSearchParams(location.search);
  anTrack('pageview', { url: location.href, tmdb: params.get('tmdb') || '' });

  var tmdb = params.get('tmdb');
  var mediaType = params.get('type') || 'movie';
  var season = params.get('season') || '';
  var episode = params.get('episode') || '';
  var hasExplicitAutoplay = params.has('autoplay');
  var autoplay = params.get('autoplay') !== '0';
  var introSkip = true;
  var hasExplicitSkip = params.has('skipintro');
  if (hasExplicitSkip) introSkip = params.get('skipintro') !== '0';

  if (!tmdb) {
    var m = location.pathname.match(/\/embed\/(movie|tv)\/(\d+)(?:\/(\d+)\/(\d+))?/);
    if (m) { mediaType = m[1]; tmdb = m[2]; season = m[3] || ''; episode = m[4] || ''; }
  }

  fetch('/api/settings').then(function(r) { return r.json(); }).then(function(s) {
    if (!hasExplicitAutoplay && s.autoplay === false) autoplay = false;
    if (!hasExplicitSkip && s.introSkip !== true) introSkip = false;
  }).catch(function() {});

  var container = document.getElementById('player-container');
  var overlay = document.getElementById('status-overlay');
  var spinner = document.getElementById('status-spinner');
  var statusIcon = document.getElementById('status-icon');
  var statusTitle = document.getElementById('status-title');
  var statusSubtitle = document.getElementById('status-subtitle');
  var errorBox = document.getElementById('error-box');
  var skipMsgEl = document.getElementById('skipMsg');
  var videoEl = null;
  var plyr = null;
  var hlsInstance = null;
  var streams = [];
  var currentIdx = 0;
  var autoBtn = null;
  var qualityBtn = null;
  var audioBtn = null;
  var hlsLevels = [];
  var hlsAudioTracks = [];
  var currentHlsLevel = -1;
  var currentHlsAudio = -1;
  var menuEl = null;
  var segments = null;
  var skipActive = false;

  function setStatus(title, subtitle, showSpinner) {
    statusTitle.textContent = title;
    statusSubtitle.textContent = subtitle || '';
    spinner.style.display = showSpinner !== false ? '' : 'none';
    statusIcon.style.display = 'none';
    overlay.classList.remove('hidden');
  }

  function showError(msg) {
    spinner.style.display = 'none';
    statusIcon.style.display = 'block';
    statusTitle.textContent = 'Unable to load stream';
    statusSubtitle.textContent = msg;
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
    errorBox.style.display = 'none';
  }

  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }

  function showSkipMsg(text) {
    skipMsgEl.textContent = text;
    skipMsgEl.classList.add('show');
    clearTimeout(skipMsgEl._timer);
    skipMsgEl._timer = setTimeout(function() { skipMsgEl.classList.remove('show'); }, 3000);
  }

  function fetchTimestamps() {
    if (!introSkip || !tmdb) return;
    var url = '/api/intro-timestamps?tmdb_id=' + encodeURIComponent(tmdb) + '&type=' + encodeURIComponent(mediaType);
    if (season) url += '&season=' + encodeURIComponent(season);
    if (episode) url += '&episode=' + encodeURIComponent(episode);
    fetch(url).then(function(r) { return r.ok ? r.json() : null; }).then(function(d) { segments = d; }).catch(function() {});
  }

  function checkSkip() {
    if (!segments || !videoEl || skipActive) return;
    var t = videoEl.currentTime * 1000;
    var dur = (videoEl.duration || 0) * 1000;
    if (segments.intro && segments.intro.length) {
      var intro = segments.intro[0];
      var end = intro.end_ms;
      if (end && t >= (intro.start_ms || 0) && t < end && end < dur - 5000) {
        skipActive = true; showSkipMsg('⏭ Skipping intro'); videoEl.currentTime = end / 1000;
        setTimeout(function() { skipActive = false; }, 500); return;
      }
    }
    if (segments.recap && segments.recap.length) {
      var recap = segments.recap[0];
      var rEnd = recap.end_ms;
      if (rEnd && t >= (recap.start_ms || 0) && t < rEnd && rEnd < dur - 5000) {
        skipActive = true; showSkipMsg('⏭ Skipping recap'); videoEl.currentTime = rEnd / 1000;
        setTimeout(function() { skipActive = false; }, 500); return;
      }
    }
    if (segments.credits && segments.credits.length) {
      var cred = segments.credits[0];
      if (cred.start_ms && t >= cred.start_ms && (!cred.end_ms || t < cred.end_ms)) {
        skipActive = true; showSkipMsg('⏭ Skipping credits');
        videoEl.currentTime = cred.end_ms ? cred.end_ms / 1000 : videoEl.duration;
        setTimeout(function() { skipActive = false; }, 500); return;
      }
    }
    if (segments.preview && segments.preview.length) {
      var prev = segments.preview[0];
      if (prev.start_ms && t >= prev.start_ms && (!prev.end_ms || t < prev.end_ms)) {
        skipActive = true; showSkipMsg('⏭ Skipping preview');
        videoEl.currentTime = prev.end_ms ? prev.end_ms / 1000 : videoEl.duration;
        setTimeout(function() { skipActive = false; }, 500);
      }
    }
  }

  function createPlyr() {
    if (plyr) plyr.destroy();
    plyr = new Plyr(videoEl, cfg.plyr);
    plyr.on('controlsshow', injectAutoBtn);
  }

  function injectAutoBtn() {
    if (autoBtn && autoBtn.parentNode) return;
    if (!plyr || !plyr.elements.controls) return;
    autoBtn = document.createElement('button');
    autoBtn.className = 'plyr__controls__item plyr__control plyr__control--autoplay' + (autoplay ? ' plyr__control--pressed' : '');
    autoBtn.innerHTML = 'Auto';
    autoBtn.addEventListener('click', function(e) { e.preventDefault(); autoplay = !autoplay; autoBtn.classList.toggle('plyr__control--pressed', autoplay); });
    var ref = plyr.elements.controls.querySelector('[data-plyr="fullscreen"]');
    if (ref) ref.parentNode.insertBefore(autoBtn, ref);
    injectHlsControls();
  }

  function injectHlsControls() {
    if (!plyr || !plyr.elements.controls) return;
    var ref = plyr.elements.controls.querySelector('[data-plyr="fullscreen"]') || plyr.elements.controls.lastElementChild;
    if (!ref) return;
    if (hlsLevels.length > 0 && !qualityBtn) {
      qualityBtn = document.createElement('button');
      qualityBtn.className = 'plyr__controls__item plyr__control plyr__control--quality';
      qualityBtn.innerHTML = 'Auto';
      qualityBtn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); showQualityMenu(); });
      ref.parentNode.insertBefore(qualityBtn, ref);
    }
    if (hlsAudioTracks.length > 1 && !audioBtn) {
      audioBtn = document.createElement('button');
      audioBtn.className = 'plyr__controls__item plyr__control plyr__control--audio plyr__control--pressed';
      audioBtn.innerHTML = hlsAudioTracks[0] ? hlsAudioTracks[0].name || 'Audio' : 'Audio';
      audioBtn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); showAudioMenu(); });
      ref.parentNode.insertBefore(audioBtn, ref);
    }
  }

  function createHlsMenu(items, current, onSelect) {
    closeMenu();
    menuEl = document.createElement('div');
    menuEl.className = 'hls-menu';
    for (var i = 0; i < items.length; i++) {
      (function(val, label) {
        var btn = document.createElement('button');
        btn.textContent = label;
        if (val === current) btn.classList.add('is-active');
        btn.addEventListener('click', function() { closeMenu(); onSelect(val); });
        menuEl.appendChild(btn);
      })(items[i].value, items[i].label);
    }
    var ref = qualityBtn || audioBtn || autoBtn;
    if (ref && ref.parentNode) ref.parentNode.appendChild(menuEl);
  }

  function showQualityMenu() {
    if (!hlsLevels.length) return;
    var items = [{ label: 'Auto', value: -1 }];
    for (var i = 0; i < hlsLevels.length; i++) {
      items.push({ label: (hlsLevels[i].height || '?') + 'p', value: i });
    }
    createHlsMenu(items, currentHlsLevel, function(val) {
      currentHlsLevel = val;
      if (hlsInstance) hlsInstance.currentLevel = val;
      if (qualityBtn) qualityBtn.innerHTML = val === -1 ? 'Auto' : (hlsLevels[val] ? hlsLevels[val].height + 'p' : 'Quality');
      qualityBtn.classList.toggle('plyr__control--pressed', val !== -1);
      anTrack('quality_change', { from: currentHlsLevel, to: val });
    });
  }

  function showAudioMenu() {
    if (!hlsAudioTracks.length) return;
    var items = hlsAudioTracks.map(function(t, i) { return { label: t.name || 'Track ' + (i + 1), value: i }; });
    createHlsMenu(items, currentHlsAudio, function(val) {
      currentHlsAudio = val;
      if (hlsInstance) hlsInstance.audioTrack = val;
      if (audioBtn) audioBtn.innerHTML = hlsAudioTracks[val] ? hlsAudioTracks[val].name || 'Audio' : 'Audio';
      audioBtn.classList.add('plyr__control--pressed');
      anTrack('audio_change', { from: currentHlsAudio, to: val });
    });
  }

  function setupHlsQualityAudio() {
    if (!hlsInstance) return;
    hlsLevels = hlsInstance.levels || [];
    hlsAudioTracks = hlsInstance.audioTracks || [];
    currentHlsLevel = hlsInstance.currentLevel;
    currentHlsAudio = hlsInstance.audioTrack;
    injectHlsControls();
  }

  function destroyPlayer() {
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (plyr) { plyr.destroy(); plyr = null; }
    if (videoEl) { videoEl.remove(); videoEl = null; }
  }

  function playUrl(url, type) {
    destroyPlayer();
    overlay.classList.remove('hidden');
    spinner.style.display = '';
    statusIcon.style.display = 'none';
    errorBox.style.display = 'none';
    setStatus('Starting playback...', 'Buffering stream content');

    videoEl = document.createElement('video');
    videoEl.playsInline = true;
    videoEl.preload = 'auto';
    if (autoplay) videoEl.autoplay = true;
    videoEl.crossOrigin = '';
    videoEl.addEventListener('error', function() { tryNext(); });
    videoEl.addEventListener('timeupdate', checkSkip);
    videoEl.addEventListener('canplay', hideOverlay);
    videoEl.addEventListener('play', function() {
      anTrack('play', { url: url, tmdb: tmdb, mediaType: mediaType });
      anStartHeartbeat({ currentUrl: location.href });
    });
    container.appendChild(videoEl);
    createPlyr();
    fetchTimestamps();

    var isHls = type === 'm3u8' || (!type && (url.includes('/proxy') || url.includes('.m3u8')));
    if (isHls && Hls.isSupported()) {
      hlsInstance = new Hls(cfg.hls);
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { setupHlsQualityAudio(); });
      hlsInstance.on(Hls.Events.ERROR, function(e, data) {
        if (data.fatal) { hlsInstance.destroy(); hlsInstance = null; videoEl.src = url; }
      });
    } else if (isHls && videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url;
    } else {
      videoEl.src = url;
    }
    if (autoplay) { videoEl.play().catch(function() {}); anTrack('play', { url: url, type: type, tmdb: tmdb }); anStartHeartbeat({ currentUrl: location.href }); }
    preloadRemainingStreams(currentIdx);
  }

  function preloadRemainingStreams(fromIdx) {
    for (var i = fromIdx + 1; i < streams.length; i++) {
      fetch(streams[i].url, { method: 'GET', headers: { 'Range': 'bytes=0-0' } }).catch(function() {});
    }
  }

  function tryNext() {
    currentIdx++;
    anTrack('error', { message: 'Stream failed', index: currentIdx - 1, tmdb: tmdb });
    if (currentIdx < streams.length) {
      playUrl(streams[currentIdx].url, streams[currentIdx].type);
    } else {
      showError('All sources failed to load.');
    }
  }

  // ── Main ──
  if (tmdb) {
    setStatus('Finding streams...', 'Searching available sources for this title');

    function handleResults(data) {
      if (data && data.totalStreams > 0) {
        (data.results || []).forEach(function(p) {
          (p.streams || []).forEach(function(s) {
            streams.push({ url: s.proxyUrl, type: s.type || 'm3u8' });
          });
        });
      }
    }

    function startPlayback() {
      if (streams.length === 0) { showError('No streams found.'); return; }
      setStatus('Starting playback...', 'Loading selected stream');
      playUrl(streams[0].url, streams[0].type);
    }

    if (params.get('type')) {
      // Single type search
      var tUrl = '/api/search?q=' + encodeURIComponent(tmdb) + '&type=' + encodeURIComponent(mediaType);
      if (season) tUrl += '&season=' + encodeURIComponent(season);
      if (episode) tUrl += '&episode=' + encodeURIComponent(episode);
      fetch(tUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(data) { handleResults(data); startPlayback(); }).catch(function() { startPlayback(); });
    } else {
      // Parallel movie + TV search — whichever responds first with streams
      var movieUrl = '/api/search?q=' + encodeURIComponent(tmdb) + '&type=movie';
      var tvUrl = '/api/search?q=' + encodeURIComponent(tmdb) + '&type=tv&season=' + encodeURIComponent(season || '1') + '&episode=' + encodeURIComponent(episode || '1');
      var movieDone = false, tvDone = false;
      function checkBoth() {
        if (movieDone && tvDone) startPlayback();
      }
      fetch(movieUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(data) { handleResults(data); movieDone = true; checkBoth(); }).catch(function() { movieDone = true; checkBoth(); });
      fetch(tvUrl).then(function(r) { return r.ok ? r.json() : null; }).then(function(data) { handleResults(data); tvDone = true; checkBoth(); }).catch(function() { tvDone = true; checkBoth(); });
    }
    return;
  }

  // Legacy mode
  var id = params.get('id');
  var u = params.get('u');
  var h = params.get('h');
  if (!id && !u) {
    showError('Pass ?tmdb=ID or use /embed/movie/ID or /embed/tv/ID/season/episode.');
    return;
  }
  var proxyUrl = id ? '/proxy?id=' + encodeURIComponent(id) : '/proxy?u=' + encodeURIComponent(u) + (h ? '&h=' + encodeURIComponent(h) : '');
  var embedType = params.get('type') || '';
  setStatus('Starting playback...', 'Loading stream');
  createVideo();

  // Legacy helpers
  function createVideo() {
    videoEl = document.createElement('video');
    videoEl.playsInline = true;
    videoEl.preload = 'auto';
    if (autoplay) videoEl.autoplay = true;
    videoEl.crossOrigin = '';
    container.appendChild(videoEl);
    createPlyr();
    var isHls = embedType === 'm3u8' || (!embedType && (proxyUrl.includes('/proxy') || proxyUrl.includes('.m3u8')));
    if (isHls && Hls.isSupported()) {
      hlsInstance = new Hls(cfg.hls);
      hlsInstance.loadSource(proxyUrl);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { setupHlsQualityAudio(); });
    } else if (isHls && videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = proxyUrl;
    } else {
      videoEl.src = proxyUrl;
    }
    if (autoplay) { videoEl.play().catch(function() {}); }
    videoEl.addEventListener('play', function() { anTrack('play', { url: proxyUrl, tmdb: tmdb, legacy: true }); anStartHeartbeat({ currentUrl: location.href }); });
    videoEl.addEventListener('canplay', hideOverlay);
    videoEl.addEventListener('error', function() { showError('Failed to load video.'); });
  }

  document.addEventListener('click', function(e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
})();
</script>
</body>
</html>
